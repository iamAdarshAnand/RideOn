<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RIDEON Control</title><style>body{font:16px system-ui;background:#101216;color:#f4f4f4;margin:0}header{padding:25px;background:#f6c744;color:#171717}main{max-width:1050px;margin:auto;padding:24px}section{background:#1c2026;padding:20px;border-radius:16px;margin:18px 0}input,button{padding:12px;border:0;border-radius:8px;margin:4px}button{background:#f6c744;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #41454c;text-align:left}small{color:#bbb}</style></head><body><header><h1>RIDEON / CONTROL CENTER</h1><strong>Development-only admin console</strong></header><main><p>API URL <input id="base" value="http://localhost:3000"><button onclick="load()">Refresh</button></p><section><h2>Operations</h2><div id="stats"></div></section><section><h2>Driver approvals</h2><input id="name" placeholder="Driver name"><input id="phone" placeholder="Phone"><button onclick="addDriver()">Register driver</button><div id="drivers"></div></section><section><h2>Recent trips</h2><div id="rides"></div></section><small>Demo only. No authentication or payment. Do not expose this admin panel publicly.</small></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options){const r=await fetch($('base').value+path,{...options,headers:{'Content-Type':'application/json'}});if(!r.ok)throw Error(await r.text());return r.json()}
async function load(){try{const [s,d,r]=await Promise.all([api('/api/admin/stats'),api('/api/admin/drivers'),api('/api/rides')]);$('stats').textContent=`Registered drivers: ${s.drivers} | `+s.rides.map(x=>`${x.status}: ${x.count}`).join(' | ');$('drivers').innerHTML=d.drivers.map(x=>`<p>${esc(x.name)} — ${x.approved?'Approved':`Pending <button data-id="${esc(x.id)}" class="approve">Approve</button>`}</p>`).join('')||'No drivers';$('rides').innerHTML='<table><tr><th>Vehicle</th><th>Route</th><th>Fare</th><th>Status</th></tr>'+r.rides.map(x=>`<tr><td>${esc(x.vehicle)}</td><td>${esc(x.pickup)} → ${esc(x.dropoff)}</td><td>${esc(x.fare)}</td><td>${esc(x.status)}</td></tr>`).join('')+'</table>';document.querySelectorAll('.approve').forEach(b=>b.onclick=async()=>{await api('/api/admin/drivers/'+b.dataset.id+'/approve',{method:'POST'});load()})}catch(e){alert(e.message)}}
async function addDriver(){try{await api('/api/admin/drivers',{method:'POST',body:JSON.stringify({name:$('name').value,phone:$('phone').value})});load()}catch(e){alert(e.message)}}load();
</script></body></html>
